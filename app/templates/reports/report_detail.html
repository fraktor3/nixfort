{% extends "base.html" %}{% load nx %}
{% block title %}{{ report.title }}{% endblock %}
{% block content %}
<nav class="small mb-2"><a href="{% url 'inventory:project_detail' project.id %}">{{ project.name }}</a> / <a href="{% url 'reports:list' project.id %}">отчёты</a></nav>
<div class="d-flex justify-content-between align-items-start mb-3">
  <div><h1 class="h3 mb-0">{{ report.title }}</h1><div class="small text-muted">SHA-256 данных: <span class="mono">{{ report.sha256 }}</span></div></div>
  {% if can_export %}<div class="btn-group"><a class="btn btn-outline-secondary" href="{% url 'reports:download' project.id report.id 'pdf' %}">PDF</a>
  <a class="btn btn-outline-secondary" href="{% url 'reports:download' project.id report.id 'json' %}">JSON</a></div>{% endif %}
</div>
<div class="report">{% include "reports/_document.html" %}</div>
{% endblock %}
