{% load nx %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>{{ report.title }}</title>
<style>
@page { size: A4; margin: 16mm 14mm 18mm 14mm; @bottom-right { content: "стр. " counter(page) " из " counter(pages); font-family: "DejaVu Sans", sans-serif; font-size: 7.5pt; color: #4b5259; } @bottom-left { content: "{{ report.sha256|slice:':16' }}"; font-family: "DejaVu Sans Mono", monospace; font-size: 7pt; color: #4b5259; } }
body { font-family: "DejaVu Sans", sans-serif; font-size: 8.6pt; line-height: 1.38; color: #14171a; }
h1 { font-size: 15pt; margin: 0 0 3pt; font-weight: bold; } h2 { font-size: 11.5pt; margin: 14pt 0 5pt; padding-bottom: 2pt; border-bottom: 1.2pt solid #14171a; page-break-after: avoid; } h3 { font-size: 9.6pt; margin: 9pt 0 3pt; page-break-after: avoid; }
p { margin: 0 0 5pt; }
table { width: 100%; border-collapse: collapse; margin: 3pt 0 7pt; page-break-inside: auto; }
th { text-align: left; font-weight: normal; color: #4b5259; font-size: 7.6pt; padding: 3pt 4pt; border-bottom: 0.8pt solid #9aa1a8; }
td { padding: 3pt 4pt; border-bottom: 0.4pt solid #dadee3; vertical-align: top; } tr { page-break-inside: avoid; }
.num { text-align: right; } .nowrap { white-space: nowrap; }
.mono, .id { font-family: "DejaVu Sans Mono", monospace; font-size: 7.6pt; } .id { color: #4b5259; margin-right: 3pt; }
.small, .xs, .muted, .sub { color: #4b5259; font-size: 7.6pt; } .sub { display: block; }
.st.s-fail, .st.s-error { color: #b3261e; font-weight: bold; } .st.s-unknown { color: #855000; font-weight: bold; } .st.s-run { color: #1f5aa8; }
.tag { font-size: 7pt; padding: 0 2pt; border: 0.5pt solid #9aa1a8; }
tr.changed td { background: #f2f3f5; }
.kv-row { margin: 6pt 0; padding: 4pt 0; border-top: 0.6pt solid #9aa1a8; border-bottom: 0.6pt solid #9aa1a8; }
.kv-row dt { display: inline; color: #4b5259; font-size: 7.6pt; margin: 0 3pt 0 0; } .kv-row dd { display: inline; margin: 0 14pt 0 0; font-size: 11pt; font-weight: bold; }
.tw { margin: 0; } ul { padding-left: 14pt; }
</style></head><body>
<h1>{{ report.title }}</h1>
<div class="small">Сформирован {{ d.generated_at|isodt }} · {{ d.generated_by|default:"–" }} · SHA-256 данных <span class="mono">{{ report.sha256 }}</span></div>
{% include "reports/_document.html" %}
</body></html>
