{% extends "base.html" %}
{% block content %}
<h1 class="h3">{% if project %}Проект «{{ project.name }}»{% else %}Новый проект{% endif %}</h1>
<div class="col-md-7"><form method="post">{% include "core/_form.html" %}
  <button class="btn btn-primary">Сохранить</button>
  <a class="btn btn-link" href="{% if project %}{% url 'inventory:project_detail' project.id %}{% else %}{% url 'inventory:project_list' %}{% endif %}">Отмена</a></form></div>
{% endblock %}
