{% load nx %}<table class="t tight">
  <tbody>{% for l in t.layers %}<tr><td>{{ l.layer }}<span class="sub">{{ l.observed|nb }}</span></td>
    <td class="num">{% if l.ok %}<span class="st s-pass">сработал</span>{% elif l.ok == False %}<span class="st s-fail">не сработал</span>{% else %}<span class="st s-unknown">нет данных</span>{% endif %}</td></tr>
  {% empty %}<tr><td class="empty">{{ t.summary|default:"Нет данных."|nb }}</td></tr>{% endfor %}</tbody>
</table>
