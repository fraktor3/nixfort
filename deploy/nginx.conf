# TLS reverse proxy for NIXFORT. Certificates: ./secrets/tls (make tls).

# Sign-in attempts per client address (POST only; opening the page is not limited). django-axes still locks
# an account after 5 failures; this limit slows down guessing across many usernames.
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=login:10m rate=20r/m;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/nixfort.crt;
    ssl_certificate_key /etc/nginx/tls/nixfort.key;
    # Mozilla "intermediate": TLS 1.2 only with forward-secret AEAD suites, TLS 1.3 with its defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 110m;   # PCAP limit is 100 MiB, enforced again by the app
    client_body_timeout 60s;
    client_header_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Docker's DNS: the address of "web" is looked up again after the container is recreated,
    # so nginx does not need a restart after an update.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:8000;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1h;
    }

    location = /accounts/login/ {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
