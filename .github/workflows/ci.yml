name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and contract tests
        run: pytest -q -m "not integration"
      - name: Agent tests on stdlib only
        run: cd agent && python -m unittest discover -s tests -t .
      - name: Dependency audit (informational)
        run: pip-audit || true
